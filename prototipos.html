<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mi Eunacom · Prototipos navegables</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
:root{--pink:#EB488E;--ink:#1A1A2E;--g200:#E2EAED;--g500:#7B919B;--g700:#46606B}
html{color-scheme:light}body{margin:0;height:100vh;display:flex;flex-direction:column;background:#E9F1F4;color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.top{display:none;height:44px;flex:none;align-items:center;gap:12px;padding:0 14px;background:#fff;border-bottom:1px solid var(--g200)}
.top .brand{font-weight:800;font-size:14px;white-space:nowrap}.top .brand em{font-style:normal;color:var(--pink)}
.top .seg{display:flex;flex:none;border:1.5px solid var(--g200);border-radius:100px;overflow:hidden}
.top .seg button{font:inherit;font-size:12.5px;font-weight:700;padding:6px 16px;border:0;background:#fff;color:var(--g700);cursor:pointer;white-space:nowrap}
.top .seg button.on{background:var(--pink);color:#fff}
.top .seg button:not(.on):hover{color:var(--pink)}
.top .hint{font-size:11.5px;color:var(--g500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.stage{flex:1;min-height:0;position:relative}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#E9F1F4;visibility:hidden}
.stage iframe.on{visibility:visible}
.load{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;color:var(--g700);background:#E9F1F4;z-index:2}
.load[hidden]{display:none}
@media (max-width:720px){.top .hint{display:none}}
</style>
<div class="top"><span class="brand">Mi <em>Eunacom</em> · Prototipos</span><span class="seg"><button id="bw">Web</button><button id="ba">App</button></span><span class="sp"></span><span class="hint" id="hint"></span></div>
<div class="stage" id="stage"><iframe id="fw" title="Prototipo web"></iframe><iframe id="fa" title="Prototipo app"></iframe><div class="load" id="load">Cargando…</div></div>


<script>
(function(){
var HINT={web:'Plataforma web · Desktop y Mobile · pantallas reales + Clases en vivo',app:'App descargable · Teléfono e iPad · entregable Figma'};
var loaded={},cur=null;
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function inflate(p){var r=await fetch(p==='web'?'pw.bin':'pa.bin',{cache:'no-cache'});var ds=new DecompressionStream('deflate-raw');return await new Response(r.body.pipeThrough(ds)).text()}
async function show(p){if(p!=='web'&&p!=='app')p='web';cur=p;
  document.getElementById('bw').className=p==='web'?'on':'';document.getElementById('ba').className=p==='app'?'on':'';
  document.getElementById('hint').textContent=HINT[p];
  var f=document.getElementById(p==='web'?'fw':'fa'),o=document.getElementById(p==='web'?'fa':'fw');
  o.classList.remove('on');
  if(!loaded[p]){document.getElementById('load').hidden=false;var html=await inflate(p);f.srcdoc=html;loaded[p]=true;f.addEventListener('load',function(){document.getElementById('load').hidden=true},{once:true});setTimeout(function(){document.getElementById('load').hidden=true},4000)}
  f.classList.add('on');
  try{localStorage.setItem('mieunacom-prod',p)}catch(e){}
  if(location.hash!=='#'+p)history.replaceState(null,'','#'+p)}
document.getElementById('bw').onclick=function(){show('web')};document.getElementById('ba').onclick=function(){show('app')};
window.addEventListener('message',function(e){var d=e.data;if(d&&d.mieunacomProd)show(d.mieunacomProd)});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if((h==='web'||h==='app')&&h!==cur)show(h)});
var start=location.hash.slice(1);/* mientras trabajamos la app, parte en App (teléfono); #web abre la web */
show(start||'app');
})();
</script>
</body></html>
